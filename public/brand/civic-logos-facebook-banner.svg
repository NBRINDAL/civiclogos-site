<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="624" viewBox="0 0 1640 624" role="img" aria-labelledby="title desc">
  <title id="title">Civic Logos Facebook banner</title>
  <desc id="desc">A large Civic Logos mark and Helvetica Bold wordmark on a warm ivory background.</desc>
  <defs>
    <radialGradient id="warm-red" cx="12%" cy="12%" r="42%">
      <stop offset="0%" stop-color="#b04a42" stop-opacity="0.08" />
      <stop offset="58%" stop-color="#b04a42" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="soft-blue" cx="88%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#365984" stop-opacity="0.08" />
      <stop offset="62%" stop-color="#365984" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="quiet-green" cx="52%" cy="92%" r="42%">
      <stop offset="0%" stop-color="#567043" stop-opacity="0.07" />
      <stop offset="64%" stop-color="#567043" stop-opacity="0" />
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.025" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1640" height="624" fill="#f3efe7" />
  <rect width="1640" height="624" fill="url(#warm-red)" />
  <rect width="1640" height="624" fill="url(#soft-blue)" />
  <rect width="1640" height="624" fill="url(#quiet-green)" />
  <rect width="1640" height="624" filter="url(#grain)" opacity="0.38" />

  <g transform="translate(430 222)">
    <g transform="translate(0 0)">
      <rect x="14" y="14" width="132" height="132" fill="none" stroke="#365984" stroke-width="6" />
      <circle cx="80" cy="80" r="74.4" fill="none" stroke="#b04a42" stroke-width="6" />
      <circle cx="80" cy="80" r="14.4" fill="#567043" />
      <circle cx="80" cy="80" r="28" fill="#567043" opacity="0.14" />
    </g>
    <text
      x="222"
      y="106"
      fill="#13212b"
      font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
      font-size="76"
      font-weight="700"
      letter-spacing="0.02em">Civic Logos</text>
  </g>
</svg>
